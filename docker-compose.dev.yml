# AI-BAZAR dev infrastructure (PostgreSQL + Redis)
# Запуск: docker compose -f docker-compose.dev.yml up -d
# Остановка: docker compose -f docker-compose.dev.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: masmarket_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: masmarket
      POSTGRES_PASSWORD: masmarket_pass
      POSTGRES_DB: masmarket
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masmarket -d masmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: masmarket_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
